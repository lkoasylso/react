name: Run Jobs Parallel
on: [push, workflow_dispatch]
jobs:
  Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Run Our Test
        run: npm test
  Deploy:
    needs: Tests 
    runs-on: ubuntu-latest
    steps:
      - name: SecondJob-FirstStep
        run: echo "Second job, first step DONE."   
      - name: SecondJob-SecondStep
        run: echo "Second job, second step DONE."        
  