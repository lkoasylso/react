name: First Work Flow
run: push
jobs:
  first-job: 
    run-on: ubunto-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Run Our Test
        run: npm test